# Identity of the add-on. Everything else (java_version, hytale_version,
# manifest_group, mod_author, server versions, tooling flags) is inherited
# from the root gradle.properties.
mod_name = ObolTrade
mod_id = obol-trade
main_class = dev.galysso.obol.trade.TradePlugin
mod_description = Player-to-player trading of items and coins.
version = 0.1.0

# Obol's public API as read by this add-on (Obol.playerWallet, transferTo).
manifest_dependencies = Galysso:obol=>=0.2.0
# Hail (the player interaction menu) when present: Trade sits in its menu.
# Absent, the add-on hooks F on a player by itself.
manifest_opt_dependencies = Galysso:hail=>=0.1.0

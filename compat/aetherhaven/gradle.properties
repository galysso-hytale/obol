# Identity of the compat mod. Everything else (java_version, hytale_version,
# manifest_group, mod_author, server versions, tooling flags) is inherited
# from the root gradle.properties.
mod_name = ObolAetherhaven
mod_id = obol-aetherhaven
main_class = dev.galysso.obol.compat.aetherhaven.ObolAetherhavenPlugin
mod_description = Aetherhaven pays, earns and displays in Obol coins. Its gold loot drops as Obol lootbags.
version = 0.1.0

# Obol's public API (Obol.playerWallet, Coins, ObolUi) and Aetherhaven's
# economy SPI (AetherhavenEconomy.register), which lands after 3.2.0.
manifest_dependencies = Galysso:obol=>=0.2.0, Hexvane:Aetherhaven=>=3.2.0
# The lootbag add-on when present: gold loot becomes a bag of the same value.
manifest_opt_dependencies = Galysso:obol-lootbag=>=0.1.0
